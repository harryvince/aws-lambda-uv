[project]
name = "greet"
version = "0.1.0"
description = "HTTP API: POST /greet"
requires-python = ">=3.14"
# Only these (and what they pull in) go into this function's zip.
dependencies = [
  "pydantic>=2.12",
]

# Dependency groups never reach the zip: SAM exports uv.lock with --no-default-groups.
[dependency-groups]
dev = [
  "pytest>=8.4",
]

[tool.uv]
# This is an application, not a package to build and install.
package = false
