AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Example Python Lambda built by AWS SAM with uv

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, test, stage, prod]
    Description: Which environment this stack is. Each stage is its own stack (see samconfig.toml).

Conditions:
  IsProd: !Equals [!Ref Stage, prod]

Globals:
  Function:
    Runtime: python3.14
    # arm64 is cheaper than x86_64. uv fetches arm64 wheels even on an x86_64 machine, so no Docker is needed to build.
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: !If [IsProd, INFO, DEBUG]

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # Build with uv instead of pip. SAM reads pyproject.toml in CodeUri and installs exactly what uv.lock pins.
      BuildMethod: python-uv
    Properties:
      FunctionName: !Sub "hello-world-${Stage}"
      CodeUri: functions/hello_world/
      Handler: app.handler
      LoggingConfig:
        LogGroup: !Ref HelloWorldLogs
      Events:
        Greet:
          Type: HttpApi
          Properties:
            Path: /greet
            Method: POST

  HelloWorldLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/hello-world-${Stage}"
      RetentionInDays: !If [IsProd, 90, 7]

Outputs:
  FunctionName:
    Value: !Ref HelloWorldFunction
  GreetUrl:
    Description: 'POST a JSON body such as {"name": "Ada"} here'
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/greet"
